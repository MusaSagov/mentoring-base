<div class="user-list">
  <p appHoverShadow>{{ user.name | customUpperCase }}</p>
  <p red appHoverShadow>{{ user.email | customUpperCase }}</p>
  <p appHoverShadow>{{ user.website | customUpperCase }}</p>
  <p red appHoverShadow>{{ user.company.name }}</p>
  <button red class="btn" (click)="openDelDialog()">Удалить ЮЗЕРА</button>
  <button
    red
    class="btn"
    (click)="openDialog()"
    matTooltip="Редактировать данные пользователя"
  >
    Редактировать ЮЗЕРА
  </button>
</div>
