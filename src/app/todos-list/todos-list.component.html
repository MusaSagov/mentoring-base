<div class="container">
  <app-create-todo-form
    (createTodo)="createTodo($event)"
  ></app-create-todo-form>
  <div class="todos-list">
    <div class="todo-list" *ngFor="let todo of todos$ | async">
      <app-todo-card
        [todo]="todo"
        (deleteTodo)="deleteTodo($event)"
      ></app-todo-card>
    </div>
  </div>
</div>
