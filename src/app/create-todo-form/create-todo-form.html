<h1>create todos</h1>
<div class="wrapper">
  <form [formGroup]="form" class="form-create mat">
    <mat-form-field>
      <mat-label>Название задачи</mat-label>
      <input class="form-input" matInput formControlName="title" />
      <mat-error>задание введено неправльно</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Автор задачи</mat-label>
      <input class="form-input" matInput formControlName="userId" />
      <mat-error>задание введено неправльно</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Задача завершена?</mat-label>
      <input class="form-input" matInput formControlName="completed" />
      <mat-error>введено неправльно</mat-error>
    </mat-form-field>

    <button
      (click)="submitForm()"
      type="submit"
      class="btn"
      [disabled]="form.invalid"
      matIconSuffix
      mat-raised-button
    >
      CRETE TODO
      <mat-icon>add</mat-icon>
    </button>
  </form>
</div>
